<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Workshop — ASEAN Motor Club{% endblock %}</title>
  <meta name="description" content="{% block description %}Browse Motor Town workshop vehicles, paints, decals and builds shared by the ASEAN Motor Club community.{% endblock %}">
  {% block robots %}<meta name="robots" content="index,follow">{% endblock %}
  <link rel="canonical" href="{% block canonical %}https://www.aseanmotorclub.com/workshop/{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ASEAN Motor Club">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/workshop/static/workshop.css?v=2">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/workshop/" aria-label="ASEAN Motor Club Workshop home">
        <span class="brand-mark">AMC</span><span>Workshop</span>
      </a>
      <nav aria-label="Workshop">
        <a href="/workshop/" {% if page == 'home' %}aria-current="page"{% endif %}>Discover</a>
        <a href="/workshop/gallery/" {% if page == 'gallery' %}aria-current="page"{% endif %}>Gallery</a>
      </nav>
    </div>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Community workshop browser · read-only · ASEAN Motor Club</p>
    </div>
  </footer>
  <script src="/workshop/static/snapshots.js?v=1" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
