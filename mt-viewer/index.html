<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motor Town — Boxy 3D viewer</title>
<style>
  body { margin:0; background:#17171a; color:#eee; font-family:system-ui,sans-serif; overflow:hidden; }
  #hud { position:fixed; top:12px; left:12px; z-index:10; background:rgba(0,0,0,.65); padding:8px 14px; border-radius:8px; font-size:13px; pointer-events:none; line-height:1.6; }
  #hud b { color:#6cf; }
  #status { position:fixed; top:12px; right:12px; z-index:10; background:rgba(0,0,0,.65); padding:6px 12px; border-radius:8px; font-size:12px; color:#9f9; pointer-events:none; }
  #controls { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:8px; }
  #controls button { background:#2a2a30; color:#eee; border:1px solid #444; border-radius:6px; padding:6px 14px; font-size:13px; cursor:pointer; }
  #controls button:hover { background:#3a3a44; }
  #controls button.active { background:#1d6fd1; border-color:#1d6fd1; }
</style>
</head>
<body>
<div id="hud"><b>Motor Town — Boxy</b><br>drag to orbit · scroll to zoom · right-drag to pan</div>
<div id="status">loading…</div>
<div id="controls">
  <button data-look="front">Front</button>
  <button data-look="side">Side</button>
  <button data-look="rear">Rear</button>
  <button data-look="top">Top</button>
</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const manifest = await (await fetch("boxy.json")).json();
const statusEl = document.getElementById("status");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17171a);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 20000);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);

// Lighting
scene.add(new THREE.HemisphereLight(0xffffff, 0x283040, 1.3));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4, 6, 3); scene.add(key);
const fill = new THREE.DirectionalLight(0x7799ff, 0.5);
fill.position.set(-4, 2, -3); scene.add(fill);

// Ground + axes
const grid = new THREE.GridHelper(20, 30, 0x3366aa, 0x1f2f4f);
scene.add(grid);
scene.add(new THREE.AxesHelper(2));

const loader = new GLTFLoader();
const root = new THREE.Group();
scene.add(root);

let done = 0, total = manifest.parts.length;
for (const part of manifest.parts) {
  try {
    const g = await loader.loadAsync("glb/" + part.glb);
    const model = g.scene;
    // GLBs were exported with ExportMaterials=false -> no usable material; force a lit one.
    model.traverse(o => { if (o.isMesh) o.material = new THREE.MeshStandardMaterial({ color: 0xc9cdd4, roughness: 0.55, metalness: 0.2 }); });
    // UE uses cm; CUE4Parse exports geometry in metres. Blueprint positions are in cm -> divide by 100.
    model.position.set(part.position.x / 100, part.position.z / 100, -part.position.y / 100);
    model.scale.set(part.scale.x, part.scale.z, part.scale.y);
    root.add(model);
  } catch(e) { console.warn("fail", part.id, e.message); }
  done++; statusEl.textContent = `loaded ${done}/${total}`;
}

// frame car
const box = new THREE.Box3().setFromObject(root);
const c = box.getCenter(new THREE.Vector3());
const s = box.getSize(new THREE.Vector3());
const r = Math.max(s.x, s.y, s.z) * 1.8 + 0.5;
camera.position.copy(c).add(new THREE.Vector3(r*0.7, r*0.6, r*0.9));
controls.target.copy(c);
statusEl.textContent = `loaded ${total}/${total} · ${s.x.toFixed(2)}×${s.y.toFixed(2)}×${s.z.toFixed(2)} m`;

function setView(look){
  const dist = camera.position.distanceTo(controls.target);
  const p = { front:[0,1,1], side:[1,0,1], rear:[0,1,-1], top:[0,1,0] }[look];
  camera.position.copy(controls.target).add(new THREE.Vector3(p[0]*dist, p[2]*dist, p[1]*dist ? p[1]*dist : 1)*0); // placeholder
}
document.querySelectorAll("#controls button").forEach(b => {
  b.addEventListener("click", () => {
    const look = b.dataset.look;
    const dist = camera.position.distanceTo(controls.target);
    const dirs = {
      front: new THREE.Vector3(0.2, 0.15, 1),
      side:  new THREE.Vector3(1, 0.1, 0.2),
      rear:  new THREE.Vector3(-0.2, 0.15, -1),
      top:   new THREE.Vector3(0, 1, 0.001)
    };
    camera.position.copy(controls.target).add(dirs[look].multiplyScalar(dist));
    controls.update();
  });
});

function anim(){ requestAnimationFrame(anim); controls.update(); renderer.render(scene, camera); }
if (location.search.includes("sync")) { controls.update(); renderer.render(scene, camera); }
else anim();
addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
